[package]
name = "pinch-zoom"
version = "0.1.0"
edition = "2024"
description = "Windows tray tool: turn touchpad pinch (Ctrl+wheel) into window zoom keys for VS Code"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Magnification",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
