[package]
name = "pinch-zoom"
version = "0.1.0"
edition = "2024"
description = "Windows tray tool: turn touchpad pinch (Ctrl+wheel) into window zoom keys for VS Code"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Magnification",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-application-services = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = { version = "0.3", features = ["objc2-io-surface"] }
objc2-foundation = "0.3"
# 直接は使わないが、CoreVideo が返す IOSurface を CoreFoundation の型として扱えるようにするため
objc2-io-surface = "0.3"
objc2-quartz-core = "0.3"
objc2-screen-capture-kit = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
